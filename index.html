<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JAGUAR MEDICAL EQUIPMENTS</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
}

body {
    background: #ffffff;
    color: #111;
}

/* NAVBAR */
nav {
    display: flex;
    justify-content: space-between;
    padding: 20px 40px;
    position: sticky;
    top: 0;
    background: white;
    border-bottom: 1px solid #eee;
}

nav h2 {
    font-weight: 600;
}

nav a {
    text-decoration: none;
    color: #111;
    margin-left: 20px;
    font-size: 14px;
}

/* HERO */
.hero {
    height: 90vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;

    background: linear-gradient(to bottom, #f5f7fa, #ffffff);
}

.hero h1 {
    font-size: 48px;
    font-weight: 600;
}

.hero p {
    margin-top: 10px;
    color: #555;
    font-size: 18px;
}

.hero button {
    margin-top: 25px;
    padding: 12px 25px;
    border: none;
    border-radius: 25px;
    background: #0071e3;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

/* PRODUCT SECTION */
.section {
    padding: 60px 40px;
    text-align: center;
}

.section h2 {
    font-size: 32px;
    margin-bottom: 30px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
}

.card {
    background: #fff;
    border-radius: 15px;
    padding: 20px;
    transition: 0.3s;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}

.card:hover {
    transform: translateY(-5px);
}

.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 10px;
}

.card h3 {
    margin-top: 15px;
}

.card p {
    color: #666;
    font-size: 14px;
}

.card button {
    margin-top: 10px;
    padding: 10px;
    width: 100%;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.buy {
    background: #000;
    color: white;
}

/* FOOTER */
footer {
    padding: 40px;
    text-align: center;
    color: #888;
    font-size: 14px;
}
</style>

</head>

<body>

<!-- NAVBAR -->
<nav>
<h2>JAGUAR MEDICAL</h2>
<div>
<a href="#">Home</a>
<a href="#">Products</a>
<a href="#">Contact</a>
</div>
</nav>

<!-- HERO -->
<section class="hero">
<h1>Precision in Sterilization</h1>
<p>Trusted Medical Equipment for Hospitals & Labs</p>

<button onclick="contact()">Contact on WhatsApp</button>
</section>

<!-- PRODUCTS -->
<section class="section">
<h2>Featured Products</h2>

<div class="products">

<!-- PRODUCT -->
<section class="product-grid">

  <!-- PRODUCT CARD -->
  <div class="product-card">
    <img src="https://raw.githubusercontent.com/jme/REPO/main/images/product1.jpg" />

    <h3>Medical Item Name</h3>
    <p>Short description of the product</p>

    <button onclick="openWhatsApp('Medical Item Name')">
      Buy Now
    </button>
  </div>

</section>

<!-- FOOTER -->
<footer>
© 2026 JAGUAR MEDICAL EQUIPMENTS  
Sales & Service | Direct Supply
</footer>

<script>

function contact() {
    window.open("https://wa.me/919441430014", "_blank");
}

function buyNow(product) {
    let message = "Hello, I want to buy: " + product;
    let url = "https://wa.me/919441430014?text=" + encodeURIComponent(message);
    window.open(url, "_blank");
}

</script>

</body>
</html>
