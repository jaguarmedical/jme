<body>

<!-- NAV -->
<nav>

</nav>

<!-- MENU -->

    <a href="#contact" onclick="toggleMenu()">Contact</a>
</div>

<!-- HERO -->
<section class="hero">
    <div class="hero-left">
        <h1>Medical Equipment Supplier Hyderabad</h1>
        <p>Telangana • Andhra Pradesh • ICU & Oxygen Systems</p>
    </div>

    <div class="circle-img-container">
        <img src="images/logo.png">
    </div>
</section>

<!-- PRODUCTS -->
<section class="section" id="products">

<div class="products">

<div class="card">
<img src="https://source.unsplash.com/300x200/?ventilator">
<h3>BIPAP Machine</h3>
<p>ICU Respiratory Support</p>
<button class="btn add" onclick="addToCart('BIPAP')">Add</button>
<button class="btn remove" onclick="removeFromCart('BIPAP')">Remove</button>
</div>

<div class="card">
<img src="https://source.unsplash.com/300x200/?oxygen">
<h3>Oxygen Concentrator</h3>
<p>Medical Oxygen System</p>
<button class="btn add" onclick="addToCart('Oxygen')">Add</button>
<button class="btn remove" onclick="removeFromCart('Oxygen')">Remove</button>
</div>

</div>
</section>

<!-- CART -->
<div class="cart-box">
<h3>Cart</h3>
<div id="cartList">Empty</div>
</div>

<!-- WHATSAPP -->
<div class="bottom-bar" onclick="sendCart()">
🟢 Order via WhatsApp
</div>

<script>
let cart=[];

function addToCart(i){
    let f=cart.find(c=>c.name===i);
    if(f) f.qty++;
    else cart.push({name:i,qty:1});
    update();
}

function removeFromCart(i){
    let f=cart.find(c=>c.name===i);
    if(f){
        f.qty--;
        if(f.qty<=0) cart=cart.filter(c=>c.name!==i);
    }
    update();
}

function update(){
    let box=document.getElementById("cartList");
    if(cart.length===0) return box.innerHTML="Empty";

    box.innerHTML=cart.map((c,i)=>`${i+1}. ${c.name} × ${c.qty}`).join("<br>");
}

function sendCart(){
    let msg="Order:%0A";
    cart.forEach((c,i)=>{
        msg+=`${i+1}. ${c.name} × ${c.qty}%0A`;
    });
    window.open("https://wa.me/916301065447?text="+msg);
}

function toggleMenu(){
    document.getElementById("menu").classList.toggle("open");
}

/* 🔥 BASIC PROTECTION */
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("keydown",e=>{
    if(e.ctrlKey && ["u","s","c"].includes(e.key)) e.preventDefault();
    if(e.key==="F12") e.preventDefault();
});
</script>
